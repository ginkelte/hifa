name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pinned on purpose: the local environment is 3.12, and an unpinned runner silently
          # moved to 3.14, where `starlette.testclient` requires `httpx2` instead of `httpx` and
          # every web test died at collection. A floating interpreter turns CI into a random
          # number generator for dependency resolution.
          python-version: "3.12"

      - name: Install the project and the test tooling
        run: |
          # setup-uv already created the virtualenv at .venv (VIRTUAL_ENV); creating it again
          # fails with "A virtual environment already exists".
          uv pip install --python .venv/bin/python -e ".[web,test]" pytest ruff import-linter

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Architecture contracts
        run: .venv/bin/lint-imports

      - name: Edge parity (CLI vs web)
        run: .venv/bin/python scripts/check_edge_parity.py

      - name: Spec vs code drift
        run: .venv/bin/python scripts/ci_drift_check.py
