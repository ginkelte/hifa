name: Release

# SPEC-110 §2.4 — the one job that turns a merged conventional commit into a version.
# The engine (npm `semantic-release`) computes the next version from `LAST_TAG..HEAD`, writes it as
# the literal in `pyproject.toml`, regenerates `CHANGELOG.md`, pushes one `chore(release): X [skip ci]`
# commit (admin bypass, §2.7.1), creates a signed annotated tag and publishes the GitHub Release.
# Ten steps, in this order; a step may be renamed, the effects may not be reordered.

on:
  push:
    branches: [main]
  # §2.4: manual dispatch is for re-running a failure, never for releasing an arbitrary commit
  # (§10). `dry_run` defaults to true, so the normal dispatch path writes nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Compute and print the release plan; write nothing.

# §2.7.2: inert for the engine — every API call reads `GITHUB_TOKEN`, which is the PAT below.
# It is kept as the declaration of intent (and it does govern any action using `github.token`).
permissions:
  contents: read

# §2.4: a release is never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # §2.7: the PAT authenticates the push, the tag push and the release creation.
  GITHUB_TOKEN: ${{ secrets.HIFA_RELEASE_TOKEN }}
  HIFA_RELEASE_TOKEN: ${{ secrets.HIFA_RELEASE_TOKEN }}
  HIFA_RELEASE_SIGNING_KEY: ${{ secrets.HIFA_RELEASE_SIGNING_KEY }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # §2.4.1: `[skip ci]` already keeps GitHub from creating a run for the release commit; this is
    # the second net, not the loop breaker on its own.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      # Step 1 — checkout with the full history: the engine needs `LAST_TAG..HEAD`.
      # `persist-credentials: false` because the repository is public (no token is needed to fetch)
      # and the PAT must never be written to `.git/config` (§2.4 step 1, REQ-S110-03). The push
      # credential is injected in step 7 through `GIT_CONFIG_*` and lives in the environment only.
      - name: Checkout (full history, no persisted credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 2 — the Node/npm pair the lockfile was generated with (§2.8). Unpinned Node is a
      # different dependency tree and a different lockfileVersion.
      - name: Set up Node (pinned to the lockfile pair)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      # Step 3 — fail closed before anything can be written. The value is never printed.
      - name: Token gate
        run: |
          set +x
          if [ -z "${HIFA_RELEASE_TOKEN:-}" ]; then
            echo "release_token_missing"
            exit 1
          fi
          echo "::notice::HIFA_RELEASE_TOKEN is present (value never printed)"

      # Step 4 — `npm ci` from the versioned lockfile, never `npm install`, never an inline
      # manifest (§2.8, REQ-N110-05). The pre-run state is captured here so step 9 can prove that a
      # dry run wrote nothing.
      - name: Install the pinned release engine
        run: |
          npm ci
          test -f node_modules/.package-lock.json
          git diff --exit-code -- package-lock.json
          echo "PRE_RUN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRE_RUN_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_ENV"
          git ls-remote --tags origin | sort > "$RUNNER_TEMP/tags_before.txt"
          echo "::notice::node $(node --version) / npm $(npm --version) / engine from package-lock.json"

      # Step 5 — the dry-run split. `inputs.dry_run` is empty on a push, so a push releases and only
      # a dispatch can (and by default does) run a dry run.
      - name: Resolve the dry-run mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "SEMANTIC_RELEASE_ARGS=--dry-run" >> "$GITHUB_ENV"
            echo "RELEASE_DRY_RUN=true" >> "$GITHUB_ENV"
            echo "::notice::semantic-release arguments: --dry-run (nothing will be written)"
          else
            echo "SEMANTIC_RELEASE_ARGS=" >> "$GITHUB_ENV"
            echo "RELEASE_DRY_RUN=false" >> "$GITHUB_ENV"
            echo "::notice::semantic-release arguments: (none) — this run may write"
          fi

      # Step 6 — identity and signing (§2.4.1, verbatim). `user.signingkey` is the PRIVATE half:
      # SSH signing needs the private key (or an agent that holds it); the public half exists only as
      # the `hifa-release` line in allowed_signers. Binding it to a `.pub` makes `git tag` fail with
      # "Could not read SSH key" — i.e. the partial state of §2.3.1.
      - name: Configure identity and SSH signing
        run: |
          set +x
          umask 077
          if [ -z "${HIFA_RELEASE_SIGNING_KEY:-}" ]; then
            echo "release_signing_key_missing"
            exit 1
          fi
          printf '%s\n' "$HIFA_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/hifa_signing_key"
          chmod 600 "$RUNNER_TEMP/hifa_signing_key"
          ssh-keygen -y -f "$RUNNER_TEMP/hifa_signing_key" > "$RUNNER_TEMP/hifa_signing_key.pub"
          # The agent is belt and braces: `git tag` signs from the file path below, and the agent
          # only makes the same key reachable for any tool that talks to an agent.
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/hifa_signing_key" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          git config user.name "hifa release"
          git config user.email "hifa-release@users.noreply.github.com"
          git config gpg.format ssh
          # The PRIVATE key, per §2.4.1 — never the `.pub`.
          git config user.signingkey "$RUNNER_TEMP/hifa_signing_key"
          git config gpg.ssh.allowedSignersFile .github/signers/allowed_signers
          git config commit.gpgSign true
          git config tag.gpgSign true
          # §2.3: the engine calls `git tag <name> <ref>` with no `-m`; with `tag.gpgSign=true` that
          # aborts unless an editor supplies the message. This helper writes the tag name.
          echo "GIT_EDITOR=$GITHUB_WORKSPACE/.github/release/tag-message.sh" >> "$GITHUB_ENV"
          git var GIT_COMMITTER_IDENT

      # Step 7 — the push credential travels in the environment, never in `.git/config`
      # (§2.4.1, REQ-S110-03). `GIT_CONFIG_*` makes git add the header to every request of every
      # later step without writing it to disk; the derived value is masked, the token is not printed.
      - name: Put the push credential in the environment
        run: |
          set +x
          auth=$(printf 'x-access-token:%s' "$HIFA_RELEASE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          header="AUTHORIZATION: basic $auth"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.extraheader"
            echo "GIT_CONFIG_VALUE_0=$header"
          } >> "$GITHUB_ENV"
          # Observable of step 1: no credential reached the repository configuration.
          test "$(grep -c extraheader .git/config || true)" = "0"

      # Step 8 — the pinned binary, never `npx` (§7.2). The log is captured because step 9 needs it
      # to separate failures that leave an identical repository state (`release_tag_push_rejected`
      # vs `release_partial_state`). Row 3 is produced here: the pre-flight signs a disposable
      # `preflight-*` tag inside `verifyConditions`, so a key that cannot sign aborts before
      # `prepare` writes anything (§2.3.1).
      - name: Run semantic-release
        run: |
          set +e
          ./node_modules/.bin/semantic-release ${SEMANTIC_RELEASE_ARGS} 2>&1 \
            | tee "$RUNNER_TEMP/semantic-release.log"
          status=${PIPESTATUS[0]}
          log="$RUNNER_TEMP/semantic-release.log"
          echo "RELEASE_LOG=$log" >> "$GITHUB_ENV"
          echo "RELEASE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          if [ "$status" -ne 0 ] \
             && grep -qE 'verifyConditions|signing pre-flight' "$log" \
             && ! grep -q 'signing pre-flight ok' "$log"; then
            # Row 3 of §2.4.2: the pre-flight could not sign or verify its tag. Nothing was written.
            echo "release_signing_key_invalid"
            echo "RELEASE_CODE_EMITTED=1" >> "$GITHUB_ENV"
            exit 1
          fi
          exit "$status"

      # Step 9 — the outcome assertion (§2.4.2). `if: always()`: an engine that exits non-zero skips
      # every later step without it, so nothing would ever be classified. Prints exactly one row, the
      # first match in the precedence order of §2.4.2, and it is the only place that classifies a run.
      - name: Post-conditions (outcome assertion)
        if: always()
        run: |
          set +eu
          set -o pipefail

          log="${RELEASE_LOG:-$RUNNER_TEMP/semantic-release.log}"
          status="${RELEASE_EXIT_CODE:-0}"

          emit() {
            echo "$1"
            echo "RELEASE_CODE_EMITTED=1" >> "$GITHUB_ENV"
            exit 1
          }

          # One code per run: a step that already classified the failure owns the log line.
          if [ "${RELEASE_CODE_EMITTED:-0}" = "1" ]; then
            echo "the producing step already printed the code of this run (see the step above)"
            exit 1
          fi

          tag=$(grep -oE 'Created tag v[0-9]+\.[0-9]+\.[0-9]+' "$log" 2>/dev/null \
            | tail -1 | awk '{print $3}')

          # Row 1 and row 2 — the two secrets, higher precedence than any state below.
          [ -n "${HIFA_RELEASE_TOKEN:-}" ] || emit release_token_missing
          [ -n "${HIFA_RELEASE_SIGNING_KEY:-}" ] || emit release_signing_key_missing

          # Row 3 — the pre-flight never reached "signing pre-flight ok".
          if [ "$status" -ne 0 ] \
             && grep -qE 'verifyConditions|signing pre-flight' "$log" 2>/dev/null \
             && ! grep -q 'signing pre-flight ok' "$log" 2>/dev/null; then
            emit release_signing_key_invalid
          fi

          # G1 — a dry run writes nothing: HEAD, the tree, `origin/main` and the tag list unchanged.
          if [ "${RELEASE_DRY_RUN:-false}" = "true" ]; then
            head_now=$(git rev-parse HEAD)
            main_now=$(git ls-remote origin refs/heads/main | cut -f1)
            git ls-remote --tags origin | sort > "$RUNNER_TEMP/tags_after.txt"
            if [ "$head_now" != "${PRE_RUN_HEAD:-$head_now}" ]; then
              echo "dry run moved HEAD: ${PRE_RUN_HEAD} -> $head_now"
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "dry run left the tree dirty:"
              git status --porcelain
              exit 1
            fi
            if [ "$main_now" != "${PRE_RUN_MAIN:-$main_now}" ]; then
              echo "dry run moved origin/main: ${PRE_RUN_MAIN} -> $main_now"
              exit 1
            fi
            if ! cmp -s "$RUNNER_TEMP/tags_before.txt" "$RUNNER_TEMP/tags_after.txt"; then
              echo "dry run created a tag:"
              diff -u "$RUNNER_TEMP/tags_before.txt" "$RUNNER_TEMP/tags_after.txt" || true
              exit 1
            fi
            echo "green: nothing written — dry run, HEAD $head_now, origin/main unchanged, no new tag"
            exit 0
          fi

          # G3 — nothing to release (R4): no tag for a new version, no release commit, literal intact.
          if grep -q 'no relevant changes' "$log" 2>/dev/null \
             && ! git log -1 --format=%s \
                  | grep -qE '^chore\(release\): [0-9]+\.[0-9]+\.[0-9]+ \[skip ci\]$'; then
            echo "green: no release — 'no relevant changes', no tag, no release commit, literal unchanged"
            exit 0
          fi

          if [ -n "$tag" ]; then
            # Row 4 — an annotated object with a good SSH signature against allowed_signers.
            object_type=$(git cat-file -t "refs/tags/$tag" 2>/dev/null) || object_type=missing
            [ "$object_type" = "tag" ] || emit release_tag_not_signed
            git verify-tag "$tag" >/dev/null 2>&1 || emit release_tag_not_signed
            # Row 5 — the release commit itself verifies against allowed_signers.
            git verify-commit "$tag^{commit}" >/dev/null 2>&1 || emit release_commit_unsigned
            # Row 6 — exactly one literal, equal to the tag without its `v`.
            literal=$(git show "$tag:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p')
            literal_count=$(git show "$tag:pyproject.toml" | grep -c '^version = "' || true)
            [ "$literal" = "${tag#v}" ] && [ "$literal_count" = "1" ] || emit release_version_mismatch
          fi

          # Row 7 — the API refused release creation: the tag exists, the Release does not (§5.4).
          if grep -qE 'Resource not accessible by integration|status: 403|403 Forbidden|must have admin rights' \
             "$log" 2>/dev/null; then
            emit release_forbidden
          fi

          # Row 8 — the changelog at the tag must mention the version (§2.6, R9).
          if [ -n "$tag" ]; then
            grep -qF "# [${tag#v}]" <(git show "$tag:CHANGELOG.md" 2>/dev/null) \
              || emit release_notes_missing
          fi

          # G2 — a release: the tag is on the remote and every assertion above passed.
          if [ -n "$tag" ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag" 2>/dev/null)" ]; then
            verified=$(git verify-tag "$tag" 2>&1 | tail -1)
            echo "green: release $tag — $verified; literal = ${tag#v}; CHANGELOG header present"
            exit 0
          fi

          # Row 9 — the remote rejected the tag push. The message never echoes the credential.
          if grep -qiE 'remote rejected|pre-receive hook declined|failed to push some refs|protected branch|GH013|cannot lock ref' \
             "$log" 2>/dev/null; then
            emit release_tag_push_rejected
          fi

          # Row 10 — the partial state of §5.5: release commit and literal on `main`, no tag.
          git fetch --quiet --tags --force origin || true
          subject=$(git log -1 --format=%s origin/main 2>/dev/null)
          if printf '%s' "$subject" \
             | grep -qE '^chore\(release\): [0-9]+\.[0-9]+\.[0-9]+ \[skip ci\]$'; then
            version=$(printf '%s' "$subject" \
              | sed -E 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+) \[skip ci\]$/\1/')
            main_literal=$(git show origin/main:pyproject.toml 2>/dev/null \
              | sed -n 's/^version = "\([^"]*\)"$/\1/p')
            remote_tags=$(git ls-remote --tags origin "refs/tags/v$version" 2>/dev/null)
            if [ "$main_literal" = "$version" ] && [ -z "$remote_tags" ]; then
              emit release_partial_state
            fi
          fi

          # Row 11 — none of the above: the engine exited without a release and without the
          # `no relevant changes` token (§9's silent-abort class). Reported, never a silent no-op.
          emit release_engine_aborted

      # Step 10 — cleanup, on red and on green (§2.7, REQ-S110-01). Never prints the key.
      - name: Clean up the key and the pre-flight refs
        if: always()
        run: |
          set +e
          git tag --list 'preflight-*' | xargs -r -n1 git tag -d
          rm -f "$RUNNER_TEMP/hifa_signing_key" "$RUNNER_TEMP/hifa_signing_key.pub"
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null 2>&1
          fi
          echo "cleanup: key removed, pre-flight refs deleted, agent killed"
