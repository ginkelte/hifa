name: Release

# The one job that turns a merged conventional commit into a version.
# The engine (npm `semantic-release`) computes the next version from `LAST_TAG..HEAD`, writes it as
# the literal in `pyproject.toml`, regenerates `CHANGELOG.md`, pushes one `chore(release): X [skip ci]`
# commit (admin bypass), creates a signed annotated tag and publishes the GitHub Release.
# Ten steps, in this order; a step may be renamed, the effects may not be reordered.
#
# Secret scope: there is no `env:` at workflow or job level. Each secret is declared in the
# `env:` of the single step that uses it — the PAT in steps 3 and 8, the signing key in step 6,
# `GITHUB_TOKEN` in step 8. A workflow-level `env:` would hand both secrets to the lifecycle scripts
# of the 616 packages `npm ci` installs; `--ignore-scripts` is the second, independent control.

on:
  push:
    branches: [main]
  # The self-healing fallback. GitHub suppresses every workflow run for a push whose commit
  # message quotes the skip token — silently, with no run, no check and no error — and the likely
  # author of such a message is a document explaining the token. A scheduled run with nothing to
  # release classifies itself as `green: no relevant changes`.
  schedule:
    - cron: '0 */6 * * *'
  # Manual dispatch is for re-running a failure, never for releasing an arbitrary commit
  # Here `dry_run` defaults to true, so the normal dispatch path writes nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Compute and print the release plan; write nothing.

# Inert for the engine — every API call reads `GITHUB_TOKEN`, which is the PAT below.
# It is kept as the declaration of intent (and it does govern any action using `github.token`).
permissions:
  contents: read

# A release is never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # No `if:` here. The loop breaker is the `[skip ci]` token of the release commit, which
    # GitHub already honours for `push`; a `contains()` copy of that rule also *skips* (grey, not
    # red) a legitimate release whose squash-merge body quotes the phrase.
    steps:
      # Step 1 — checkout with the full history: the engine needs `LAST_TAG..HEAD`.
      # `persist-credentials: false` because the repository is public (no token is needed to fetch)
      # and the PAT must never be written to `.git/config`.
      - name: Checkout (full history, no persisted credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 2 — the Node/npm pair the lockfile was generated with. Unpinned Node is a
      # different dependency tree and a different lockfileVersion.
      - name: Set up Node (pinned to the lockfile pair)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      # Step 3 — fail closed before anything can be written. The value is never printed, and this
      # step owns catalogue id 1: it prints the code, writes the dedupe mark and exits red.
      - name: Token gate
        env:
          HIFA_RELEASE_TOKEN: ${{ secrets.HIFA_RELEASE_TOKEN }}
        run: |
          set +x
          if [ -z "${HIFA_RELEASE_TOKEN:-}" ]; then
            echo "release_token_missing"
            : > "$RUNNER_TEMP/release_code_emitted"
            exit 1
          fi
          echo "::notice::HIFA_RELEASE_TOKEN is present (value never printed)"

      # Step 4 — `npm ci --ignore-scripts` from the versioned lockfile, never `npm install`, never
      # an inline manifest. No secret is in scope here. An empty
      # baseline is not a baseline, so every capture is asserted non-empty before it is written.
      - name: Install the pinned release engine
        run: |
          npm ci --ignore-scripts
          test -f node_modules/.package-lock.json
          git diff --exit-code -- package-lock.json
          head_sha=$(git rev-parse HEAD)
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$head_sha" && test -n "$main_sha"
          { echo "PRE_RUN_HEAD=$head_sha"; echo "PRE_RUN_MAIN=$main_sha"; } >> "$GITHUB_ENV"
          git ls-remote --tags origin | sort > "$RUNNER_TEMP/tags_before.txt"
          test -s "$RUNNER_TEMP/tags_before.txt"
          echo "PRE_RUN_TAGS=$RUNNER_TEMP/tags_before.txt" >> "$GITHUB_ENV"
          echo "::notice::node $(node --version) / npm $(npm --version) / engine from package-lock.json"

      # Step 5 — the dry-run split. `inputs.dry_run` is empty on a push, so a push releases and only
      # a dispatch can (and by default does) run a dry run. The flag the classifier reads is always
      # written; the key is non-secret.
      - name: Dry-run split
        run: |
          set -eu
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            dry=true; args="--dry-run"
          else
            dry=false; args=""
          fi
          echo "RELEASE_DRY_RUN=$dry" >> "$GITHUB_ENV"
          echo "SEMANTIC_RELEASE_ARGS=$args" >> "$GITHUB_ENV"
          echo "::notice::dry run: $dry; engine arguments: ${args:-none}"

      # Step 6 — identity and signing. `user.signingkey` is the PRIVATE half: SSH signing
      # needs the private key; the public half exists only as the `hifa-release` line in
      # allowed_signers. Binding it to a `.pub` makes `git tag` fail with "Could not read SSH key",
      # i.e. a half-configured signer. The key is visible to this step and to no other, and it
      # owns catalogue id 2.
      - name: Configure identity and SSH signing
        env:
          HIFA_RELEASE_SIGNING_KEY: ${{ secrets.HIFA_RELEASE_SIGNING_KEY }}
        run: |
          set +x; umask 077
          if [ -z "${HIFA_RELEASE_SIGNING_KEY:-}" ]; then
            echo "release_signing_key_missing"
            : > "$RUNNER_TEMP/release_code_emitted"
            exit 1
          fi
          printf '%s\n' "$HIFA_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/hifa_signing_key"
          chmod 600 "$RUNNER_TEMP/hifa_signing_key"
          ssh-keygen -y -f "$RUNNER_TEMP/hifa_signing_key" > "$RUNNER_TEMP/hifa_signing_key.pub"
          git config user.name  "hifa release"
          git config user.email "hifa-release@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/hifa_signing_key"
          git config gpg.ssh.allowedSignersFile .github/signers/allowed_signers
          git config commit.gpgSign true
          git config tag.gpgSign true
          echo "GIT_EDITOR=$GITHUB_WORKSPACE/.github/release/tag-message.sh" >> "$GITHUB_ENV"
          git var GIT_COMMITTER_IDENT

      # Step 7 — nothing has persisted the credential: assert it, write nothing. This runs
      # before the engine, so it can only prove what the earlier steps did; the state *after* the
      # write is the classifier's evaluation order 1 (`release_credential_persisted`).
      - name: Push credential scope check
        run: |
          set -eu
          if grep -qE 'HIFA_RELEASE_TOKEN|HIFA_RELEASE_SIGNING_KEY|GIT_CONFIG_|AUTHORIZATION' "$GITHUB_ENV"; then
            echo "the environment file carries a secret or the push credential (§2.4.3)"; exit 1
          fi
          if grep -q extraheader .git/config; then
            echo "the credential reached .git/config (§2.4.3)"; exit 1
          fi

      # Step 8 — the engine, with the credential materialised inside this shell only. The
      # header is built here, from the token, with `printf` + `base64`; it is exported for the life
      # of this step and never written to `$GITHUB_ENV`, which is a plain file on disk that every
      # later step sources. `::add-mask::` protects the log, not the file. This step prints no code:
      # it records `RELEASE_EXIT_CODE` and the log, and step 9 classifies.
      - name: Run semantic-release
        env:
          HIFA_RELEASE_TOKEN: ${{ secrets.HIFA_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.HIFA_RELEASE_TOKEN }}
        run: |
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HIFA_RELEASE_TOKEN" | base64 -w0)"
          echo "::add-mask::$GIT_CONFIG_VALUE_0"
          set +e
          ./node_modules/.bin/semantic-release ${SEMANTIC_RELEASE_ARGS} 2>&1 \
            | tee "$RUNNER_TEMP/semantic-release.log"
          status=${PIPESTATUS[0]}
          echo "RELEASE_LOG=$RUNNER_TEMP/semantic-release.log" >> "$GITHUB_ENV"
          echo "RELEASE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit "$status"

      # Step 9 — the outcome assertion: `if: always()`, one command, exactly one line.
      # A step that exits non-zero skips every later step without `always()`, so nothing would ever
      # be classified. The workflow carries no classification logic: the classifier is a governed,
      # executed file. The `-x` guard classifies the case that has no other
      # observable: when the checkout itself failed the script is not on disk, and a bare invocation
      # dies with a shell error instead of a code.
      - name: Post-conditions (outcome assertion)
        if: always()
        run: |
          classifier=./.github/release/assert-outcome.sh
          if [ -x "$classifier" ]; then
            "$classifier"
          else
            echo "assert-outcome: the classifier is not on disk — the checkout failed, so the run cannot be classified" >&2
            echo "release_engine_aborted"
            exit 1
          fi

      # Step 10 — cleanup, on red and on green. Never prints the key.
      - name: Clean up the key and the pre-flight refs
        if: always()
        run: |
          set +e
          git tag --list 'preflight-*' | xargs -r -n1 git tag -d
          rm -f "$RUNNER_TEMP/hifa_signing_key" "$RUNNER_TEMP/hifa_signing_key.pub"
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null 2>&1
          fi
          echo "cleanup: key removed, pre-flight refs deleted"
