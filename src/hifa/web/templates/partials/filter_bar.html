<form class="filter-bar" method="get" action="{{ vm.filter_action }}"
      hx-get="/_/issues?view={{ vm.view }}&team={{ vm.team.key }}"
      hx-trigger="keyup changed delay:250ms from:find input[name=q], change from:find select"
      hx-target="{{ vm.target }}" hx-swap="innerHTML" hx-include="closest form">
  <input type="search" name="q" class="filter-search" value="{{ vm.filter_text.q }}"
         placeholder="Filter by title" aria-label="Filter by title" autocomplete="off">
  {% for chip in vm.chips %}
  <input type="hidden" name="{{ chip.kind }}" value="{{ chip.value }}">
  {% endfor %}
  <button type="submit" class="btn">Apply</button>
  {% for chip in vm.chips %}
  <a class="chip" href="{{ chip.remove_url }}">{{ chip.label }}<span class="chip-x" aria-hidden="true">×</span></a>
  {% endfor %}
</form>
